name: Update Repo Donut

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate donut SVG
        run: |
          PUBLIC=$(curl -s -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            "https://api.github.com/user" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['public_repos'])")
          
          PRIVATE=$(curl -s -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            "https://api.github.com/user" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['total_private_repos'])")
          
          TOTAL=$((PUBLIC + PRIVATE))
          PUB_PCT=$(python3 -c "print(round($PUBLIC/$TOTAL*100))")
          PRV_PCT=$((100 - PUB_PCT))
          
          # SVG donut
          PUB_DASH=$(python3 -c "print(round($PUBLIC/$TOTAL*251.2))")
          PRV_DASH=$((252 - PUB_DASH))

          cat > donut.svg << SVGEOF
          <svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg" width="340" height="220">
            <rect width="200" height="130" rx="10" fill="#161b22"/>
            <text x="100" y="16" text-anchor="middle" fill="#F5A623" font-size="10" font-family="monospace" font-weight="bold">📦 Repositórios</text>
            <!-- donut -->
            <circle cx="70" cy="68" r="40" fill="none" stroke="#21262d" stroke-width="18"/>
            <circle cx="70" cy="68" r="40" fill="none" stroke="#F5A623" stroke-width="18"
              stroke-dasharray="${PUB_DASH} ${PRV_DASH}" stroke-dashoffset="63" transform="rotate(-90 70 68)"/>
            <circle cx="70" cy="68" r="40" fill="none" stroke="#3178C6" stroke-width="18"
              stroke-dasharray="${PRV_DASH} ${PUB_DASH}" stroke-dashoffset="$((63 - PUB_DASH))" transform="rotate(-90 70 68)"/>
            <text x="70" y="64" text-anchor="middle" fill="#ffffff" font-size="14" font-family="monospace" font-weight="bold">${TOTAL}</text>
            <text x="70" y="76" text-anchor="middle" fill="#aaaaaa" font-size="7" font-family="monospace">total</text>
            <!-- legend -->
            <rect x="125" y="40" width="10" height="10" rx="2" fill="#F5A623"/>
            <text x="140" y="49" fill="#ffffff" font-size="9" font-family="monospace">Públicos: ${PUBLIC} (${PUB_PCT}%)</text>
            <rect x="125" y="60" width="10" height="10" rx="2" fill="#3178C6"/>
            <text x="140" y="69" fill="#ffffff" font-size="9" font-family="monospace">Privados: ${PRIVATE} (${PRV_PCT}%)</text>
          </svg>
          SVGEOF

      - name: Commit SVG
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add donut.svg
          git diff --cached --quiet || git commit -m "chore: update repo donut"
          git push
