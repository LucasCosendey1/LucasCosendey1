name: Gerar Snake

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: LucasCosendey1
          outputs: |
            dist/github-snake.svg?color_snake=#F5A623&color_dots=#0d1117,#1a1200,#7a5509,#b87d0f,#F5A623
            dist/github-snake-dark.svg?color_snake=#F7C948&color_dots=#0d1117,#1a1200,#7a5509,#b87d0f,#F7C948

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --cached --quiet || git commit -m "chore: atualiza snake [skip ci]"
          git push
